version: 1
server: {socket: ~/.deckd/bench.sock}
state: {path: ~/.deckd/bench-state.json}
security: {allow_dangerous_actions: false}
devices:
  generator:
    provider: scpi
    transport: tcp
    profile: rigol-dg800
    model: DG812
    # Replace with the DG812 USB-LAN adapter's configured SCPI TCP endpoint.
    address: 127.0.0.1:5501
    shutdown: preserve
    limits:
      frequency_min_hz: 1
      frequency_max_hz: 1000000
      amplitude_min_vpp: 0.01
      amplitude_max_vpp: 1
  scope:
    provider: scpi
    transport: tcp
    profile: rigol-mho900
    model: MHO954
    address: 127.0.0.1:5502
parameters:
  bench.frequency:
    type: float
    value: 1000
    min: 1
    max: 1000000
    step: 100
    unit: Hz
    persistent: true
    instrument: {device: generator, channel: 1, operation: generator.set_frequency}
  bench.amplitude:
    type: float
    value: 0.1
    min: 0.01
    max: 1
    step: 0.01
    unit: Vpp
    persistent: true
    instrument: {device: generator, channel: 1, operation: generator.set_amplitude}
actions:
  generator.inspect: {type: scpi, device: generator, channel: 1, operation: generator.inspect}
  generator.frequency: {type: scpi, parameter: bench.frequency}
  generator.amplitude: {type: scpi, parameter: bench.amplitude}
  generator.output: {type: scpi, device: generator, channel: 1, operation: generator.output}
  generator.off: {type: scpi, device: generator, channel: 1, operation: generator.disable}
  generator.off2: {type: scpi, device: generator, channel: 2, operation: generator.disable}
  scope.capture: {type: scpi, device: scope, channel: 1, operation: scope.capture}
  bench.save: {type: experiment, experiment: bench.trace, safety: confirm}
workflows:
  bench.prepare:
    steps:
      - {action: generator.off}
      - {action: generator.off2}
      - {action: generator.frequency}
      - {action: generator.amplitude}
  bench.capture:
    stop_on_error: false
    steps:
      - {action: generator.inspect}
      - {action: scope.capture}
      - {action: generator.inspect}
experiments:
  bench.trace:
    schema_version: 1
    title: Rigol stopped-trace comparison
    description: "Physical verification pending. Disable both outputs before applying settings; separately confirm output enable, acquire and stop at the scope, then capture. This transfers an existing stopped trace; acquisition time is unknown. Record your acquisition assertion in the run note. Desired values below do not apply settings."
    workflow: bench.capture
    parameters: [bench.frequency, bench.amplitude]
    collectors:
      - {name: frequency.before, step: 0, action: generator.inspect, kind: measurement, source: native, path: [observed, generator.set_frequency], unit: Hz, quantity: frequency}
      - {name: amplitude.before, step: 0, action: generator.inspect, kind: measurement, source: native, path: [observed, generator.set_amplitude], unit: Vpp, quantity: amplitude}
      - {name: waveform, step: 1, action: scope.capture, kind: series, source: native, path: [waveform, series], unit: V, quantity: voltage}
      - {name: frequency.after, step: 2, action: generator.inspect, kind: measurement, source: native, path: [observed, generator.set_frequency], unit: Hz, quantity: frequency}
      - {name: amplitude.after, step: 2, action: generator.inspect, kind: measurement, source: native, path: [observed, generator.set_amplitude], unit: Vpp, quantity: amplitude}
    layout:
      - {id: trace, kind: series, title: Stopped trace, reference: waveform}
bindings:
  - control: bench.frequency
    rotate: {parameter: bench.frequency}
    press: {action: generator.frequency}
  - control: bench.capture
    press: {action: bench.save}
  - control: bench.baseline
    press: {baseline: bench.trace}
  - control: bench.result
    press: {result: bench.trace}
